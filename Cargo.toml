[package]
name = "moqui-device-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Moqui Ecosystem <info@moqui.org>"]
license = "CC0-1.0"
description = "Model-driven industrial edge gateway for Moqui in Rust, style mr-moqui"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database (PostgreSQL / TimescaleDB dual-pool)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "rust_decimal", "json"] }

# Protocols
rumqttc = "0.25"
opcua = { package = "async-opcua", version = "0.19", features = ["client"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = "1"
russh = { version = "0.64", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
russh-sftp = "3"

# Data, Serialization & Utils
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
base64 = "0.22"
dotenvy = "0.15"

# HTTP Client for callbacks & notifications
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
